name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install cloud function dependencies
        run: pnpm --dir cloudfunctions/entries install --frozen-lockfile
      - name: Run tests
        run: node --test tests/*.test.js
